root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/app ./cmd/app"
  entrypoint = ["./tmp/app"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor", "testdata", ".git"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  send_interrupt = true
  kill_delay = "500ms"
  stop_on_error = true
  log = "build-errors.log"

[log]
  main_only = true

[misc]
  clean_on_exit = true

services:
  app:
    build:
      context: .
      target: dev
    command: ["air", "-c", ".air.toml", "-build.poll", "true"]
    ports:
      - "${HOST_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      PORT: "8080"
    volumes:
      - .:/src
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build

volumes:
  go-mod:
  go-build:
